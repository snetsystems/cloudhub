app  = "tickscript"
id = "optics-task"
template = """
{{ define "main"}}
// This script is generated by CloudHub application, Do not edit!
// If you edit this script for test, it will be overwritten in the next generation.

var name = '__Optical Transceiver {{.OrgName}}__'

var db = '{{.OrgName}}'

var rp = '{{.RetentionPolicy}}'

// Judgement thresholds, taken from the organization's optics settings so the
// alert and the dashboard cell can never disagree. Optical power is dBm and
// higher is stronger, so a reading below the low threshold is the fault.
var rxLowDbm = {{.RxLowDbm}}

var txLowDbm = {{.TxLowDbm}}

var tempHighC = {{.TempHighC}}

var message = '{{.Message}}'

var details = '{{.Details}}'

// One series per lane of per port of per device, so an alert names the exact
// transceiver rather than the switch.
var optics = stream
    |from()
        .database(db)
        .retentionPolicy(rp)
        .measurement('snmp_nx')
        .groupBy(['dev_id', 'sys_name', 'ifName', 'opticLane'])
        .where(lambda: isPresent("opticalRxPower") OR isPresent("opticalTxPower") OR isPresent("opticalTemperature"))
    // The collector writes each reading as its own point, so a point carries
    // one field and not the other two, and a lambda referencing a missing field
    // errors. An isPresent() guard does not help: TICKscript evaluates both
    // sides of AND/OR. Standing a missing field up as its own threshold is
    // always safe instead — neither `x < x` nor `x > x` can fire.
    |default()
        .field('opticalRxPower', rxLowDbm)
        .field('opticalTxPower', txLowDbm)
        .field('opticalTemperature', tempHighC)

var trigger = optics
    |alert()
        .crit(lambda: ("opticalRxPower" < rxLowDbm) OR
            ("opticalTxPower" < txLowDbm) OR
            ("opticalTemperature" > tempHighC))
        .stateChangesOnly()
        .message(message)
        .id(name + '-{{.Group}}')
        .idTag('alertID')
        .levelTag('level')
        .messageField('message')
        .durationField('duration'){{if .Details}}.details(details){{end}}{{.AlertServices}}

var triggerData = trigger
    |eval(lambda: if("opticalRxPower" < rxLowDbm, 'Rx Power Low',
        if("opticalTxPower" < txLowDbm, 'Tx Power Low',
            if("opticalTemperature" > tempHighC, 'Temperature High', 'OK'))))
        .as('reason')
        .keep('duration', 'message', 'reason', 'opticalRxPower', 'opticalTxPower', 'opticalTemperature')

triggerData
    |influxDBOut()
        .create()
        .database('Default')
        .retentionPolicy('autogen')
        .measurement('cloudhub_alerts')
        .tag('alertName', name)
        .tag('triggerType', 'optics')

{{ if ne .OrgName "Default" }}
triggerData
    |influxDBOut()
        .create()
        .database(db)
        .retentionPolicy('autogen')
        .measurement('cloudhub_alerts')
        .tag('alertName', name)
        .tag('triggerType', 'optics')
{{ end }}
{{ end }}
"""
