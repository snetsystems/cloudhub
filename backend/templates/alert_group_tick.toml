app  = "tickscript"
id = "alert-group-task"
template = """
{{ define "stream" }}
// This script is generated by CloudHub application, Do not edit!
// If you edit this script for test, it will be overwritten in the next generation.

var name = '{{.Name}}'
var outputDB = '{{.OutputDB}}'
var outputRP = '{{.OutputRP}}'
var outputMeasurement = '{{.OutputMeasurement}}'

{{range $spec := .Specs}}
var src_{{$spec.Index}} = stream
    |from()
        .measurement('{{$spec.Measurement}}'){{if $.HostFilterLambda}}
        .where(lambda: {{$.HostFilterLambda}}){{end}}
        .groupBy('{{$spec.GroupByTag}}')
{{if eq $spec.Measurement "http_response"}}
    |eval(lambda: "server")
        .as('url')
        .tags('url')
        .keep()
{{end}}{{if $spec.EvalEnabled}}
    |eval(lambda: {{$spec.EvalExpression}})
        .as('{{$spec.EvalAs}}')
        .keep(){{end}}{{if $spec.DerivativeEnabled}}
    |derivative('{{$spec.DerivativeField}}'){{if $spec.DerivativeNonNegative}}
        .nonNegative(){{end}}
        .unit({{$spec.DerivativeUnit}}){{end}}

{{if $spec.DeadmanEnabled}}// deadman: alert when no points arrive for the configured period.
var trigger_{{$spec.Index}} = src_{{$spec.Index}}
    |deadman(0.0, {{$spec.DeadmanPeriod}}){{if $.NotifyRecovery}}
        .stateChangesOnly(){{end}}{{if $.Message}}
        .message('{{$.Message}}'){{end}}
        .id('{{$.TaskID}}_{{$spec.Index}}')
        .idTag('alertID')
        .levelTag('level')
        .messageField('message')

{{if or $.RecipientsCrit $.NotificationHandlers}}
src_{{$spec.Index}}
    |deadman(0.0, {{$spec.DeadmanPeriod}}){{if $.NotifyRecovery}}
        .stateChangesOnly({{$.PauseDuration}}){{end}}
        .noRecoveries()
        .id('{{$.TaskID}}_{{$spec.Index}}-email-crit'){{if $.Message}}
        .message('{{$.Message}}'){{end}}{{if $.EmailBody}}
        .details('{{$.EmailBody}}'){{end}}
        {{$.NotificationHandlers}}{{if $.RecipientsCrit}}
        .email(){{range $.RecipientsCrit}}
            .to('{{.}}'){{end}}{{end}}
{{end}}
{{if and $.NotifyRecovery (or $.RecipientsAll $.NotificationHandlers)}}
trigger_{{$spec.Index}}
    |where(lambda: "level" == 'OK')
    |alert()
        .info(lambda: TRUE)
        .id('{{$.TaskID}}_{{$spec.Index}}-email-recovery'){{if $.Message}}
        .message('Recovery: {{$.Message}}'){{end}}{{if $.EmailBody}}
        .details('{{$.EmailBody}}'){{end}}
        {{$.NotificationHandlers}}{{if $.RecipientsAll}}
        .email(){{range $.RecipientsAll}}
            .to('{{.}}'){{end}}{{end}}
{{end}}

{{else}}{{if $spec.RelativeEnabled}}{{$spec.RelativeBlock}}

{{end}}{{if $spec.RecentEnabled}}// occurrence_count={{$spec.OccurrenceCount}} (recent): require N matching points inside occurrence_window={{$spec.OccurrenceWindow}}
{{$spec.RecentBlock}}
{{else if $spec.OccurrenceEnabled}}// occurrence_count={{$spec.OccurrenceCount}} (consecutive): require N consecutive matching points
var processed_{{$spec.Index}} = {{$spec.SourceVar}}_{{$spec.Index}}
    |stateCount(lambda: {{$spec.OccurrenceLambda}})
{{else}}var processed_{{$spec.Index}} = {{$spec.SourceVar}}_{{$spec.Index}}
{{end}}
// Main trigger — drives the alert-history log via influxDBOut.
var trigger_{{$spec.Index}} = processed_{{$spec.Index}}
    |alert(){{if $spec.Info}}
        .info(lambda: {{$spec.Info}}){{end}}{{if $spec.Warn}}
        .warn(lambda: {{$spec.Warn}}){{end}}{{if $spec.Crit}}
        .crit(lambda: {{$spec.Crit}}){{end}}{{if $.NotifyRecovery}}
        .stateChangesOnly(){{end}}{{if $.Message}}
        .message('{{$.Message}}'){{end}}
        .id('{{$.TaskID}}_{{$spec.Index}}')
        .idTag('alertID')
        .levelTag('level')
        .messageField('message')

{{if and $spec.EmailCrit (or $.RecipientsCrit $.NotificationHandlers)}}
processed_{{$spec.Index}}
    |alert()
        .crit(lambda: {{$spec.EmailCrit}}){{if $.NotifyRecovery}}
        .stateChangesOnly({{$.PauseDuration}}){{end}}
        .noRecoveries()
        .id('{{$.TaskID}}_{{$spec.Index}}-email-crit'){{if $.Message}}
        .message('{{$.Message}}'){{end}}{{if $.EmailBody}}
        .details('{{$.EmailBody}}'){{end}}
        {{$.NotificationHandlers}}{{if $.RecipientsCrit}}
        .email(){{range $.RecipientsCrit}}
            .to('{{.}}'){{end}}{{end}}
{{end}}
{{if and $spec.EmailWarn (or $.RecipientsWarn $.NotificationHandlers)}}
processed_{{$spec.Index}}
    |alert()
        .warn(lambda: {{$spec.EmailWarn}}){{if $.NotifyRecovery}}
        .stateChangesOnly({{$.PauseDuration}}){{end}}
        .noRecoveries()
        .id('{{$.TaskID}}_{{$spec.Index}}-email-warn'){{if $.Message}}
        .message('{{$.Message}}'){{end}}{{if $.EmailBody}}
        .details('{{$.EmailBody}}'){{end}}
        {{$.NotificationHandlers}}{{if $.RecipientsWarn}}
        .email(){{range $.RecipientsWarn}}
            .to('{{.}}'){{end}}{{end}}
{{end}}
{{if and $spec.EmailInfo (or $.RecipientsInfo $.NotificationHandlers)}}
processed_{{$spec.Index}}
    |alert()
        .info(lambda: {{$spec.EmailInfo}}){{if $.NotifyRecovery}}
        .stateChangesOnly({{$.PauseDuration}}){{end}}
        .noRecoveries()
        .id('{{$.TaskID}}_{{$spec.Index}}-email-info'){{if $.Message}}
        .message('{{$.Message}}'){{end}}{{if $.EmailBody}}
        .details('{{$.EmailBody}}'){{end}}
        {{$.NotificationHandlers}}{{if $.RecipientsInfo}}
        .email(){{range $.RecipientsInfo}}
            .to('{{.}}'){{end}}{{end}}
{{end}}
{{if and $.NotifyRecovery (or $.RecipientsAll $.NotificationHandlers)}}
// Recovery branch — chained off main trigger so we only emit on state-change to OK.
trigger_{{$spec.Index}}
    |where(lambda: "level" == 'OK')
    |alert()
        .info(lambda: TRUE)
        .id('{{$.TaskID}}_{{$spec.Index}}-email-recovery'){{if $.Message}}
        .message('Recovery: {{$.Message}}'){{end}}{{if $.EmailBody}}
        .details('{{$.EmailBody}}'){{end}}
        {{$.NotificationHandlers}}{{if $.RecipientsAll}}
        .email(){{range $.RecipientsAll}}
            .to('{{.}}'){{end}}{{end}}
{{end}}
{{end}}

{{if eq $spec.Measurement "http_response"}}
trigger_{{$spec.Index}}
    |eval(lambda: if(isPresent("response_time"), float("response_time"), -1.0), lambda: if(isPresent("http_response_code"), float("http_response_code"), -1.0))
        .as('value', 'response_code')
        .keep()
    |influxDBOut()
        .create()
        .database(outputDB)
        .retentionPolicy(outputRP)
        .measurement(outputMeasurement)
        .tag('alertName', name)
        .tag('triggerType', '{{$spec.TriggerType}}')
{{else}}
trigger_{{$spec.Index}}
    |eval(lambda: float("{{$spec.HistoryValueField}}"))
        .as('value')
        .keep()
    |influxDBOut()
        .create()
        .database(outputDB)
        .retentionPolicy(outputRP)
        .measurement(outputMeasurement)
        .tag('alertName', name)
        .tag('triggerType', '{{$spec.TriggerType}}')
{{end}}
{{end}}
{{ end }}

{{ define "batch" }}
// This script is generated by CloudHub application, Do not edit!
// If you edit this script for test, it will be overwritten in the next generation.

var name = '{{.Name}}'
var outputDB = '{{.OutputDB}}'
var outputRP = '{{.OutputRP}}'
var outputMeasurement = '{{.OutputMeasurement}}'

{{range $spec := .Specs}}
var src_{{$spec.Index}} = batch
    |query('SELECT {{$spec.Field}} FROM "{{$spec.Measurement}}" WHERE time > -{{$spec.Every}}{{$.HostFilterSQL}}')
        .every({{$spec.Every}})
        .groupBy('{{$spec.GroupByTag}}')
{{if eq $spec.Measurement "http_response"}}
    |eval(lambda: "server")
        .as('url')
        .tags('url')
        .keep()
{{end}}

{{if $spec.OccurrenceEnabled}}// occurrence_count={{$spec.OccurrenceCount}} (consecutive): require N consecutive matching batches
var processed_{{$spec.Index}} = src_{{$spec.Index}}
    |stateCount(lambda: {{$spec.OccurrenceLambda}})
{{else}}var processed_{{$spec.Index}} = src_{{$spec.Index}}
{{end}}
var trigger_{{$spec.Index}} = processed_{{$spec.Index}}
    |alert(){{if $spec.Info}}
        .info(lambda: {{$spec.Info}}){{end}}{{if $spec.Warn}}
        .warn(lambda: {{$spec.Warn}}){{end}}{{if $spec.Crit}}
        .crit(lambda: {{$spec.Crit}}){{end}}{{if $.NotifyRecovery}}
        .stateChangesOnly(){{end}}{{if $.Message}}
        .message('{{$.Message}}'){{end}}
        .id('{{$.TaskID}}_{{$spec.Index}}')
        .idTag('alertID')
        .levelTag('level')
        .messageField('message')

{{if and $spec.Crit (or $.RecipientsCrit $.NotificationHandlers)}}
processed_{{$spec.Index}}
    |alert()
        .crit(lambda: {{$spec.Crit}}){{if $.NotifyRecovery}}
        .stateChangesOnly({{$.PauseDuration}}){{end}}
        .noRecoveries()
        .id('{{$.TaskID}}_{{$spec.Index}}-email-crit'){{if $.Message}}
        .message('{{$.Message}}'){{end}}{{if $.EmailBody}}
        .details('{{$.EmailBody}}'){{end}}
        {{$.NotificationHandlers}}{{if $.RecipientsCrit}}
        .email(){{range $.RecipientsCrit}}
            .to('{{.}}'){{end}}{{end}}
{{end}}
{{if and $spec.Warn (or $.RecipientsWarn $.NotificationHandlers)}}
processed_{{$spec.Index}}
    |alert()
        .warn(lambda: {{$spec.Warn}}){{if $.NotifyRecovery}}
        .stateChangesOnly({{$.PauseDuration}}){{end}}
        .noRecoveries()
        .id('{{$.TaskID}}_{{$spec.Index}}-email-warn'){{if $.Message}}
        .message('{{$.Message}}'){{end}}{{if $.EmailBody}}
        .details('{{$.EmailBody}}'){{end}}
        {{$.NotificationHandlers}}{{if $.RecipientsWarn}}
        .email(){{range $.RecipientsWarn}}
            .to('{{.}}'){{end}}{{end}}
{{end}}
{{if and $spec.Info (or $.RecipientsInfo $.NotificationHandlers)}}
processed_{{$spec.Index}}
    |alert()
        .info(lambda: {{$spec.Info}}){{if $.NotifyRecovery}}
        .stateChangesOnly({{$.PauseDuration}}){{end}}
        .noRecoveries()
        .id('{{$.TaskID}}_{{$spec.Index}}-email-info'){{if $.Message}}
        .message('{{$.Message}}'){{end}}{{if $.EmailBody}}
        .details('{{$.EmailBody}}'){{end}}
        {{$.NotificationHandlers}}{{if $.RecipientsInfo}}
        .email(){{range $.RecipientsInfo}}
            .to('{{.}}'){{end}}{{end}}
{{end}}
{{if and $.NotifyRecovery (or $.RecipientsAll $.NotificationHandlers)}}
trigger_{{$spec.Index}}
    |where(lambda: "level" == 'OK')
    |alert()
        .info(lambda: TRUE)
        .id('{{$.TaskID}}_{{$spec.Index}}-email-recovery'){{if $.Message}}
        .message('Recovery: {{$.Message}}'){{end}}{{if $.EmailBody}}
        .details('{{$.EmailBody}}'){{end}}
        {{$.NotificationHandlers}}{{if $.RecipientsAll}}
        .email(){{range $.RecipientsAll}}
            .to('{{.}}'){{end}}{{end}}
{{end}}

{{if eq $spec.Measurement "http_response"}}
trigger_{{$spec.Index}}
    |eval(lambda: if(isPresent("response_time"), float("response_time"), -1.0), lambda: if(isPresent("http_response_code"), float("http_response_code"), -1.0))
        .as('value', 'response_code')
        .keep()
    |influxDBOut()
        .create()
        .database(outputDB)
        .retentionPolicy(outputRP)
        .measurement(outputMeasurement)
        .tag('alertName', name)
        .tag('triggerType', 'threshold')
{{else}}
trigger_{{$spec.Index}}
    |eval(lambda: float("{{$spec.HistoryValueField}}"))
        .as('value')
        .keep()
    |influxDBOut()
        .create()
        .database(outputDB)
        .retentionPolicy(outputRP)
        .measurement(outputMeasurement)
        .tag('alertName', name)
        .tag('triggerType', 'threshold')
{{end}}
{{end}}
{{ end }}
"""
