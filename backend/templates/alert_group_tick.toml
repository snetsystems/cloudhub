app  = "tickscript"
id = "alert-group-task"
template = """
{{ define "stream" }}
// This script is generated by CloudHub application, Do not edit!
// If you edit this script for test, it will be overwritten in the next generation.

var name = '{{.Name}}'

var outputDB = '{{.OutputDB}}'

var outputRP = '{{.OutputRP}}'

var outputMeasurement = '{{.OutputMeasurement}}'

var src = stream
    |from()
        .measurement('{{.Measurement}}'){{if .HostFilterLambda}}
        .where(lambda: {{.HostFilterLambda}}){{end}}
        .groupBy('host')

var trigger = src
    |alert(){{if .Info}}
        .info(lambda: {{.Info}}){{end}}{{if .Warn}}
        .warn(lambda: {{.Warn}}){{end}}{{if .Crit}}
        .crit(lambda: {{.Crit}}){{end}}{{if .StateChangesOnly}}
        .stateChangesOnly(){{end}}{{if .Message}}
        .message('{{.Message}}'){{end}}
        .id('{{.TaskID}}')
        .idTag('alertID')
        .levelTag('level')
        .messageField('message')

{{if .RecipientsCrit}}
trigger
    |where(lambda: "level" == 'CRITICAL')
    |alert()
        .crit(lambda: TRUE)
        .stateChangesOnly()
        .id('{{.TaskID}}-email-crit'){{if .Message}}
        .message('{{.Message}}'){{end}}
        .email(){{range .RecipientsCrit}}
            .to('{{.}}'){{end}}
{{end}}
{{if .RecipientsWarn}}
trigger
    |where(lambda: "level" == 'WARNING')
    |alert()
        .warn(lambda: TRUE)
        .stateChangesOnly()
        .id('{{.TaskID}}-email-warn'){{if .Message}}
        .message('{{.Message}}'){{end}}
        .email(){{range .RecipientsWarn}}
            .to('{{.}}'){{end}}
{{end}}
{{if .RecipientsInfo}}
trigger
    |where(lambda: "level" == 'INFO')
    |alert()
        .info(lambda: TRUE)
        .id('{{.TaskID}}-email-info'){{if .Message}}
        .message('{{.Message}}'){{end}}
        .email(){{range .RecipientsInfo}}
            .to('{{.}}'){{end}}
{{end}}

trigger
    |influxDBOut()
        .create()
        .database(outputDB)
        .retentionPolicy(outputRP)
        .measurement(outputMeasurement)
        .tag('alertName', name)
        .tag('triggerType', 'threshold')
{{ end }}

{{ define "batch" }}
// This script is generated by CloudHub application, Do not edit!
// If you edit this script for test, it will be overwritten in the next generation.

var name = '{{.Name}}'

var outputDB = '{{.OutputDB}}'

var outputRP = '{{.OutputRP}}'

var outputMeasurement = '{{.OutputMeasurement}}'

var src = batch
    |query('SELECT {{.Field}} FROM "{{.Measurement}}" WHERE time > -{{.Every}}{{.HostFilterSQL}}')
        .every({{.Every}})
        .groupBy('host')

var trigger = src
    |alert(){{if .Info}}
        .info(lambda: {{.Info}}){{end}}{{if .Warn}}
        .warn(lambda: {{.Warn}}){{end}}{{if .Crit}}
        .crit(lambda: {{.Crit}}){{end}}{{if .StateChangesOnly}}
        .stateChangesOnly(){{end}}{{if .Message}}
        .message('{{.Message}}'){{end}}
        .id('{{.TaskID}}')
        .idTag('alertID')
        .levelTag('level')
        .messageField('message')

{{if .RecipientsCrit}}
trigger
    |where(lambda: "level" == 'CRITICAL')
    |alert()
        .crit(lambda: TRUE)
        .stateChangesOnly()
        .id('{{.TaskID}}-email-crit'){{if .Message}}
        .message('{{.Message}}'){{end}}
        .email(){{range .RecipientsCrit}}
            .to('{{.}}'){{end}}
{{end}}
{{if .RecipientsWarn}}
trigger
    |where(lambda: "level" == 'WARNING')
    |alert()
        .warn(lambda: TRUE)
        .stateChangesOnly()
        .id('{{.TaskID}}-email-warn'){{if .Message}}
        .message('{{.Message}}'){{end}}
        .email(){{range .RecipientsWarn}}
            .to('{{.}}'){{end}}
{{end}}
{{if .RecipientsInfo}}
trigger
    |where(lambda: "level" == 'INFO')
    |alert()
        .info(lambda: TRUE)
        .id('{{.TaskID}}-email-info'){{if .Message}}
        .message('{{.Message}}'){{end}}
        .email(){{range .RecipientsInfo}}
            .to('{{.}}'){{end}}
{{end}}

trigger
    |influxDBOut()
        .create()
        .database(outputDB)
        .retentionPolicy(outputRP)
        .measurement(outputMeasurement)
        .tag('alertName', name)
        .tag('triggerType', 'threshold')
{{ end }}
"""
