app  = "tickscript"
id = "alert-group-task"
template = """
{{ define "stream" }}
// This script is generated by CloudHub application, Do not edit!
// If you edit this script for test, it will be overwritten in the next generation.

var name = '{{.Name}}'

var outputDB = '{{.OutputDB}}'

var outputRP = '{{.OutputRP}}'

var outputMeasurement = '{{.OutputMeasurement}}'

var src = stream
    |from()
        .measurement('{{.Measurement}}'){{if .HostFilterLambda}}
        .where(lambda: {{.HostFilterLambda}}){{end}}
        .groupBy('host'){{if .EvalEnabled}}
    |eval(lambda: {{.EvalExpression}})
        .as('{{.EvalAs}}')
        .keep(){{end}}{{if .DerivativeEnabled}}
    |derivative('{{.DerivativeField}}'){{if .DerivativeNonNegative}}
        .nonNegative(){{end}}
        .unit({{.DerivativeUnit}}){{end}}

{{if .DeadmanEnabled}}// deadman: alert when no points arrive for the configured period.
var trigger = src
    |deadman(0.0, {{.DeadmanPeriod}})
        .stateChangesOnly(){{if .Message}}
        .message('{{.Message}}'){{end}}
        .id('{{.TaskID}}')
        .idTag('alertID')
        .levelTag('level')
        .messageField('message')

{{if or .RecipientsCrit .NotificationHandlers}}
src
    |deadman(0.0, {{.DeadmanPeriod}})
        .stateChangesOnly({{.PauseDuration}})
        .noRecoveries()
        .id('{{.TaskID}}-email-crit'){{if .Message}}
        .message('{{.Message}}'){{end}}{{if .EmailBody}}
        .details('{{.EmailBody}}'){{end}}
        {{.NotificationHandlers}}{{if .RecipientsCrit}}
        .email(){{range .RecipientsCrit}}
            .to('{{.}}'){{end}}{{end}}
{{end}}
{{if and .NotifyRecovery (or .RecipientsAll .NotificationHandlers)}}
trigger
    |where(lambda: "level" == 'OK')
    |alert()
        .info(lambda: TRUE)
        .id('{{.TaskID}}-email-recovery'){{if .Message}}
        .message('Recovery: {{.Message}}'){{end}}{{if .EmailBody}}
        .details('{{.EmailBody}}'){{end}}
        {{.NotificationHandlers}}{{if .RecipientsAll}}
        .email(){{range .RecipientsAll}}
            .to('{{.}}'){{end}}{{end}}
{{end}}

{{else}}{{if .RelativeEnabled}}{{.RelativeBlock}}

{{end}}{{if .RecentEnabled}}// occurrence_count={{.OccurrenceCount}} (recent): require N matching points inside occurrence_window={{.OccurrenceWindow}}
{{.RecentBlock}}
{{else if .OccurrenceEnabled}}// occurrence_count={{.OccurrenceCount}} (consecutive): require N consecutive points matching the current level
{{.ConsecutiveBlock}}
{{else}}var processed = {{.SourceVar}}
{{end}}
// Main trigger — drives the alert-history log via influxDBOut.
// Uses stateChangesOnly() so we don't flood the log with every input.
var trigger = processed
    |alert(){{if .Info}}
        .info(lambda: {{.Info}}){{end}}{{if .Warn}}
        .warn(lambda: {{.Warn}}){{end}}{{if .Crit}}
        .crit(lambda: {{.Crit}}){{end}}
        .stateChangesOnly(){{if .Message}}
        .message('{{.Message}}'){{end}}
        .id('{{.TaskID}}')
        .idTag('alertID')
        .levelTag('level')
        .messageField('message')

{{if and .EmailCrit (or .RecipientsCrit .NotificationHandlers)}}
// CRIT email branch — consumes processed directly so stateChangesOnly({{.PauseDuration}})
// reminders can tick on every incoming point (input flow drives the timer).
processed
    |alert()
        .crit(lambda: {{.EmailCrit}})
        .stateChangesOnly({{.PauseDuration}})
        .noRecoveries()
        .id('{{.TaskID}}-email-crit'){{if .Message}}
        .message('{{.Message}}'){{end}}{{if .EmailBody}}
        .details('{{.EmailBody}}'){{end}}
        {{.NotificationHandlers}}{{if .RecipientsCrit}}
        .email(){{range .RecipientsCrit}}
            .to('{{.}}'){{end}}{{end}}
{{end}}
{{if and .EmailWarn (or .RecipientsWarn .NotificationHandlers)}}
// WARN email branch — lambda excludes CRIT so a CRIT-matching value does not also fire WARN.
processed
    |alert()
        .warn(lambda: {{.EmailWarn}})
        .stateChangesOnly({{.PauseDuration}})
        .noRecoveries()
        .id('{{.TaskID}}-email-warn'){{if .Message}}
        .message('{{.Message}}'){{end}}{{if .EmailBody}}
        .details('{{.EmailBody}}'){{end}}
        {{.NotificationHandlers}}{{if .RecipientsWarn}}
        .email(){{range .RecipientsWarn}}
            .to('{{.}}'){{end}}{{end}}
{{end}}
{{if and .EmailInfo (or .RecipientsInfo .NotificationHandlers)}}
// INFO email branch — lambda excludes WARN and CRIT.
processed
    |alert()
        .info(lambda: {{.EmailInfo}})
        .stateChangesOnly({{.PauseDuration}})
        .noRecoveries()
        .id('{{.TaskID}}-email-info'){{if .Message}}
        .message('{{.Message}}'){{end}}{{if .EmailBody}}
        .details('{{.EmailBody}}'){{end}}
        {{.NotificationHandlers}}{{if .RecipientsInfo}}
        .email(){{range .RecipientsInfo}}
            .to('{{.}}'){{end}}{{end}}
{{end}}
{{if and .NotifyRecovery (or .RecipientsAll .NotificationHandlers)}}
// Recovery branch — chained off main trigger so we only emit on state-change to OK.
trigger
    |where(lambda: "level" == 'OK')
    |alert()
        .info(lambda: TRUE)
        .id('{{.TaskID}}-email-recovery'){{if .Message}}
        .message('Recovery: {{.Message}}'){{end}}{{if .EmailBody}}
        .details('{{.EmailBody}}'){{end}}
        {{.NotificationHandlers}}{{if .RecipientsAll}}
        .email(){{range .RecipientsAll}}
            .to('{{.}}'){{end}}{{end}}
{{end}}
{{end}}

trigger
    |influxDBOut()
        .create()
        .database(outputDB)
        .retentionPolicy(outputRP)
        .measurement(outputMeasurement)
        .tag('alertName', name)
        .tag('triggerType', '{{.TriggerType}}')
{{ end }}

{{ define "batch" }}
// This script is generated by CloudHub application, Do not edit!
// If you edit this script for test, it will be overwritten in the next generation.

var name = '{{.Name}}'

var outputDB = '{{.OutputDB}}'

var outputRP = '{{.OutputRP}}'

var outputMeasurement = '{{.OutputMeasurement}}'

var src = batch
    |query('SELECT {{.Field}} FROM "{{.Measurement}}" WHERE time > -{{.Every}}{{.HostFilterSQL}}')
        .every({{.Every}})
        .groupBy('host')

{{if .OccurrenceEnabled}}// occurrence_count={{.OccurrenceCount}} (consecutive): require N consecutive batches matching the current level
{{.ConsecutiveBlock}}
{{else}}var processed = src
{{end}}
var trigger = processed
    |alert(){{if .Info}}
        .info(lambda: {{.Info}}){{end}}{{if .Warn}}
        .warn(lambda: {{.Warn}}){{end}}{{if .Crit}}
        .crit(lambda: {{.Crit}}){{end}}
        .stateChangesOnly(){{if .Message}}
        .message('{{.Message}}'){{end}}
        .id('{{.TaskID}}')
        .idTag('alertID')
        .levelTag('level')
        .messageField('message')

{{if and .Crit (or .RecipientsCrit .NotificationHandlers)}}
processed
    |alert()
        .crit(lambda: {{.Crit}})
        .stateChangesOnly({{.PauseDuration}})
        .noRecoveries()
        .id('{{.TaskID}}-email-crit'){{if .Message}}
        .message('{{.Message}}'){{end}}{{if .EmailBody}}
        .details('{{.EmailBody}}'){{end}}
        {{.NotificationHandlers}}{{if .RecipientsCrit}}
        .email(){{range .RecipientsCrit}}
            .to('{{.}}'){{end}}{{end}}
{{end}}
{{if and .Warn (or .RecipientsWarn .NotificationHandlers)}}
processed
    |alert()
        .warn(lambda: {{.Warn}})
        .stateChangesOnly({{.PauseDuration}})
        .noRecoveries()
        .id('{{.TaskID}}-email-warn'){{if .Message}}
        .message('{{.Message}}'){{end}}{{if .EmailBody}}
        .details('{{.EmailBody}}'){{end}}
        {{.NotificationHandlers}}{{if .RecipientsWarn}}
        .email(){{range .RecipientsWarn}}
            .to('{{.}}'){{end}}{{end}}
{{end}}
{{if and .Info (or .RecipientsInfo .NotificationHandlers)}}
processed
    |alert()
        .info(lambda: {{.Info}})
        .stateChangesOnly({{.PauseDuration}})
        .noRecoveries()
        .id('{{.TaskID}}-email-info'){{if .Message}}
        .message('{{.Message}}'){{end}}{{if .EmailBody}}
        .details('{{.EmailBody}}'){{end}}
        {{.NotificationHandlers}}{{if .RecipientsInfo}}
        .email(){{range .RecipientsInfo}}
            .to('{{.}}'){{end}}{{end}}
{{end}}
{{if and .NotifyRecovery (or .RecipientsAll .NotificationHandlers)}}
trigger
    |where(lambda: "level" == 'OK')
    |alert()
        .info(lambda: TRUE)
        .id('{{.TaskID}}-email-recovery'){{if .Message}}
        .message('Recovery: {{.Message}}'){{end}}{{if .EmailBody}}
        .details('{{.EmailBody}}'){{end}}
        {{.NotificationHandlers}}{{if .RecipientsAll}}
        .email(){{range .RecipientsAll}}
            .to('{{.}}'){{end}}{{end}}
{{end}}

trigger
    |influxDBOut()
        .create()
        .database(outputDB)
        .retentionPolicy(outputRP)
        .measurement(outputMeasurement)
        .tag('alertName', name)
        .tag('triggerType', 'threshold')
{{ end }}
"""
